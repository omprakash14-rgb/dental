version: '3.8'

# =============================================================================
# DentalAI Orchestration — PostgreSQL 16 + FastAPI + Nginx Frontend
# =============================================================================

services:
  # 1. PostgreSQL Relational Database Service
  db:
    image: postgres:16-alpine
    container_name: dentalai-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dentalai}
      POSTGRES_USER: ${POSTGRES_USER:-dentalai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentalai_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentalai} -d ${POSTGRES_DB:-dentalai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dentalai-net

  # 2. FastAPI Backend & Pretrained ResNet-50 AI Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dentalai-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-dentalai}:${POSTGRES_PASSWORD:-dentalai_password}@db:5432/${POSTGRES_DB:-dentalai}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dentalai-production-super-secret-key-change-in-prod}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - RATE_LIMIT_PER_MINUTE=60
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports
      - ./backend/models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dentalai-net

  # 3. React Vite + Nginx Reverse Proxy Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dentalai-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - dentalai-net

volumes:
  postgres_data:
    driver: local

networks:
  dentalai-net:
    driver: bridge
