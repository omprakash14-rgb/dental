name: DentalAI CI/CD & Automated Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-build:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Compile TypeScript & Build Production Bundle
        working-directory: ./frontend
        run: npm run build

  backend-tests:
    name: Backend Security, RBAC & AI Inference E2E Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dentalai
          POSTGRES_USER: dentalai
          POSTGRES_PASSWORD: dentalai_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install System Libraries for OpenCV & ReportLab
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Phase 4 Security & RBAC E2E Test Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg2://dentalai:dentalai_password@localhost:5432/dentalai
          JWT_SECRET_KEY: ci-test-secret-key-32-bytes-minimum-length
        run: |
          PYTHONPATH=. python tests/test_phase4_e2e_security.py

